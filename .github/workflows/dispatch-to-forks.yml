name: Sync from upstream into hosting branch

on:
  repository_dispatch:
    types: [upstream_push]

  workflow_dispatch:

env:
  UPSTREAM_REPO: https://github.com/KadenLi6741/Localys.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: master

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hosting master branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch upstream main
        run: |
          git remote remove upstream || true
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH" --prune --tags

      - name: Merge upstream main into hosting master
        run: |
          git checkout "$TARGET_BRANCH"
          git merge "upstream/$UPSTREAM_BRANCH" --no-edit

      - name: Push hosting master
        run: |
          git push origin "$TARGET_BRANCH"
